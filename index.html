<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matcrafter</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: sans-serif; color: white; }
        canvas { display: none; width: 100vw; height: 100vh; }
        #main-menu { display: flex; width: 100vw; height: 100vh; background-color: #000000; }
        #sidebar { width: 250px; background-color: #111111; border-right: 2px solid #222222; display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar-btn { background: none; border: none; color: #aaaaaa; padding: 15px 25px; text-align: left; font-size: 18px; cursor: pointer; transition: 0.2s; }
        .sidebar-btn:hover, .sidebar-btn.active { color: #ffffff; background-color: #222222; }
        #content-area { flex-grow: 1; padding: 40px; overflow-y: auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .world-card { background-color: #161616; border: 1px solid #222222; padding: 20px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .world-info h3 { margin: 0 0 5px 0; color: #ffffff; }
        .world-info p { margin: 0; color: #777777; font-size: 14px; }
        .btn-play { background-color: #2e8b57; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px; }
        .btn-delete { background-color: #cc3333; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-create { background-color: #0088cc; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-bottom: 25px; }
        #ui-panel { display: none; position: absolute; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.8); color: white; padding: 15px; border-radius: 8px; pointer-events: none; z-index: 10; }
        #back-to-menu { display: none; position: absolute; top: 10px; right: 10px; background-color: #333333; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; z-index: 10; }
        #chat-container { display: none; position: absolute; bottom: 20px; left: 20px; width: 350px; height: 200px; background: rgba(0, 0, 0, 0.5); border-radius: 6px; padding: 10px; box-sizing: border-box; z-index: 10; }
        #chat-log { width: 100%; height: 140px; overflow-y: auto; font-size: 14px; margin-bottom: 5px; }
        #chat-input { width: 100%; background: rgba(0, 0, 0, 0.8); border: 1px solid #444; color: white; padding: 5px; box-sizing: border-box; border-radius: 4px; outline: none; }
        #crosshair { display: none; position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background-color: white; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; mix-blend-mode: difference; }
        #hud-panel { display: none; position: absolute; bottom: 20px; right: 20px; background: rgba(0, 0, 0, 0.7); color: #fff; padding: 12px 20px; border-radius: 6px; font-size: 16px; border: 1px solid #333; z-index: 10; }
        .active-slot-glow { color: #ffaa00; font-weight: bold; }
        #metrics-panel { display: none; position: absolute; top: 10px; right: 150px; background: rgba(0, 0, 0, 0.7); padding: 10px; border-radius: 6px; font-size: 14px; font-family: monospace; z-index: 10; line-height: 1.4; border: 1px solid #333; }
        .setting-row { display: flex; align-items: center; justify-content: space-between; max-width: 400px; margin-bottom: 15px; background: #161616; padding: 10px 15px; border-radius: 6px; border: 1px solid #222; }
        .setting-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .setting-row input[type="text"], .setting-row input[type="password"] { background: #222; border: 1px solid #444; color: white; padding: 6px 10px; border-radius: 4px; outline: none; }
        #auth-screen { display: flex; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
        .auth-box { background: #111; border: 1px solid #222; padding: 30px; border-radius: 8px; width: 300px; display: flex; flex-direction: column; gap: 15px; }
        .auth-box h2 { margin: 0 0 10px 0; text-align: center; }
        .auth-box input { background: #222; border: 1px solid #444; color: white; padding: 10px; border-radius: 4px; outline: none; }
        .auth-box button { background: #0088cc; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .admin-item { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 8px 12px; border-radius: 4px; margin-top: 5px; }
        .admin-del-btn { background: #cc3333; border: none; color: white; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>
    <div id="auth-screen">
        <div class="auth-box">
            <h2 id="auth-title">Create Account</h2>
            <input type="text" id="auth-user" placeholder="Username">
            <input type="password" id="auth-pass" placeholder="Password">
            <button id="auth-btn" onclick="zalogujUzytkownika()">Submit</button>
        </div>
    </div>

    <div id="main-menu">
        <div id="sidebar">
            <button class="sidebar-btn active" onclick="window.game.switchTab('worlds-tab', this)">Worlds</button>
            <button class="sidebar-btn" onclick="window.game.switchTab('settings-tab', this)">Settings</button>
        </div>
        <div id="content-area">
            <div id="worlds-tab" class="tab-content active">
                <h1 style="margin-top: 0;">Server Worlds</h1>
                <button class="btn-create" onclick="window.game.createNewWorld()">Create New World</button>
                <div id="worlds-list"></div>
            </div>
            <div id="settings-tab" class="tab-content">
                <h1 style="margin-top: 0;">Settings</h1>
                <div class="setting-row"><span>Show FPS</span><input type="checkbox" id="set-fps" checked onchange="window.game.saveSettings()"></div>
                <div class="setting-row"><span>Show TPS</span><input type="checkbox" id="set-tps" checked onchange="window.game.saveSettings()"></div>
                <div class="setting-row"><span>Show Ping</span><input type="checkbox" id="set-ping" checked onchange="window.game.saveSettings()"></div>
                <div class="setting-row"><span>Show CPS</span><input type="checkbox" id="set-cps" checked onchange="window.game.saveSettings()"></div>
                <div class="setting-row"><span>Change Password</span><input type="password" id="set-pass" placeholder="New Password" onchange="window.game.saveSettings()"></div>
                
                <div id="owner-settings-wrapper" style="display: none; margin-top: 30px; border-top: 2px solid #222; padding-top: 20px;">
                    <h2 style="color: red; margin-top: 0;">Owner Settings (Admin Control)</h2>
                    <div style="background: #111; padding: 20px; border-radius: 6px; border: 1px solid #222; max-width: 400px;">
                        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                            <input type="text" id="admin-input" placeholder="Admin Name" style="background:#222; border:1px solid #444; color:white; padding:8px; border-radius:4px; flex-grow:1; outline:none;">
                            <button onclick="window.game.addAdminUser()" style="background:#2e8b57; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">Add</button>
                        </div>
                        <div id="admin-list-box"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="ui-panel">
        <div id="player-rank"></div>
        <div id="world-info"></div>
    </div>
    <div id="metrics-panel"></div>
    <div id="chat-container"><div id="chat-log"></div><input type="text" id="chat-input" placeholder="Press Enter to type..."></div>
    <div id="crosshair"></div>
    <div id="hud-panel">Holding: None</div>
    <button id="back-to-menu" onclick="window.game.exitWorld()">Disconnect</button>
    <script>
        // Przygotowanie bezpiecznych zmiennych globalnych
        window.game = {
            currentPlayer: "Guest",
            serverAdmins: ["alex", "notch"]
        };

        function sprawdzCiasteczkaKonta() {
            const storedUser = localStorage.getItem('matcrafter_user');
            const storedPass = localStorage.getItem('matcrafter_pass');
            if (!storedUser || !storedPass) {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('auth-title').textContent = "Create Account";
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('auth-title').textContent = "Retype Password to Join";
                document.getElementById('auth-user').value = storedUser;
                document.getElementById('auth-user').disabled = true;
            }
        }

        function zalogujUzytkownika() {
            const userField = document.getElementById('auth-user').value.trim();
            const passField = document.getElementById('auth-pass').value.trim();
            if (!userField || !passField) return alert("Fill in fields!");

            const storedUser = localStorage.getItem('matcrafter_user');
            const storedPass = localStorage.getItem('matcrafter_pass');

            if (!storedUser) {
                localStorage.setItem('matcrafter_user', userField);
                localStorage.setItem('matcrafter_pass', passField);
                window.game.currentPlayer = userField;
            } else {
                if (passField !== storedPass) return alert("Wrong Password!");
                window.game.currentPlayer = storedUser;
            }
            document.getElementById('auth-screen').style.display = 'none';
            
            if (window.game.loadDashboardProfileSetup) {
                window.game.loadDashboardProfileSetup();
            }
        }

        window.addEventListener('DOMContentLoaded', sprawdzCiasteczkaKonta);
    </script>

        // Szybki skrypt bazowy uruchamiany natychmiast przed silnikiem 3D
        window.game = {
            currentPlayer: "Guest",
            serverAdmins: ["alex", "notch"],

                const storedUser = localStorage.getItem('matcrafter_user');

                    document.getElementById('auth-screen').style.display = 'flex';
                    document.getElementById('auth-title').textContent = "Create Account";
                } else {
                    document.getElementById('auth-screen').style.display = 'flex';
                    document.getElementById('auth-title').textContent = "Retype Password to Join";
                    document.getElementById('auth-user').value = storedUser;
                    document.getElementById('auth-user').disabled = true;
                }
            }
        };
        function zalogujUzytkownika() {
            const userField = document.getElementById('auth-user').value.trim();
            const passField = document.getElementById('auth-pass').value.trim();
            if (!userField || !passField) return alert("Fill in fields!");

            const storedUser = localStorage.getItem('matcrafter_user');
            const storedPass = localStorage.getItem('matcrafter_pass');

            if (!storedUser) {
                localStorage.setItem('matcrafter_user', userField);
                localStorage.setItem('matcrafter_pass', passField);
                window.game.currentPlayer = userField;
            } else {
                if (passField !== storedPass) return alert("Wrong Password!");
                window.game.currentPlayer = storedUser;
            }
            document.getElementById('auth-screen').style.display = 'none';
            
            if (window.game.loadDashboardProfileSetup) {
                window.game.loadDashboardProfileSetup();
            }
        }

        window.addEventListener('DOMContentLoaded', sprawdzCiasteczkaKonta);
    </script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com",
                "three/addons/": "https://unpkg.com"
            }
        }
    </script>
