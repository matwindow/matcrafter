<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matcrafter</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: sans-serif; color: white; }
        canvas { display: none; width: 100vw; height: 100vh; }
        #main-menu { display: flex; width: 100vw; height: 100vh; background-color: #000000; }
        #sidebar { width: 250px; background-color: #111111; border-right: 2px solid #222222; display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar-btn { background: none; border: none; color: #aaaaaa; padding: 15px 25px; text-align: left; font-size: 18px; cursor: pointer; transition: 0.2s; }
        .sidebar-btn:hover, .sidebar-btn.active { color: #ffffff; background-color: #222222; }
        #content-area { flex-grow: 1; padding: 40px; overflow-y: auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .world-card { background-color: #161616; border: 1px solid #222222; padding: 20px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .world-info h3 { margin: 0 0 5px 0; color: #ffffff; }
        .world-info p { margin: 0; color: #777777; font-size: 14px; }
        .btn-play { background-color: #2e8b57; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px; }
        .btn-delete { background-color: #cc3333; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-create { background-color: #0088cc; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-bottom: 25px; }
        #ui-panel { display: none; position: absolute; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.8); color: white; padding: 15px; border-radius: 8px; pointer-events: none; z-index: 10; }
        #back-to-menu { display: none; position: absolute; top: 10px; right: 10px; background-color: #333333; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; z-index: 10; }
        #chat-container { display: none; position: absolute; bottom: 20px; left: 20px; width: 350px; height: 200px; background: rgba(0, 0, 0, 0.5); border-radius: 6px; padding: 10px; box-sizing: border-box; z-index: 10; }
        #chat-log { width: 100%; height: 140px; overflow-y: auto; font-size: 14px; margin-bottom: 5px; }
        #chat-input { width: 100%; background: rgba(0, 0, 0, 0.8); border: 1px solid #444; color: white; padding: 5px; box-sizing: border-box; border-radius: 4px; outline: none; }
        #crosshair { display: none; position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background-color: white; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; mix-blend-mode: difference; }
        #hud-panel { display: none; position: absolute; bottom: 20px; right: 20px; background: rgba(0, 0, 0, 0.7); color: #fff; padding: 12px 20px; border-radius: 6px; font-size: 16px; border: 1px solid #333; z-index: 10; }
        .active-slot-glow { color: #ffaa00; font-weight: bold; }
        #metrics-panel { display: none; position: absolute; top: 10px; right: 150px; background: rgba(0, 0, 0, 0.7); padding: 10px; border-radius: 6px; font-size: 14px; font-family: monospace; z-index: 10; line-height: 1.4; border: 1px solid #333; }
        .setting-row { display: flex; align-items: center; justify-content: space-between; max-width: 400px; margin-bottom: 15px; background: #161616; padding: 10px 15px; border-radius: 6px; border: 1px solid #222; }
        .setting-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .setting-row input[type="text"], .setting-row input[type="password"] { background: #222; border: 1px solid #444; color: white; padding: 6px 10px; border-radius: 4px; outline: none; }
        #auth-screen { display: flex; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
        .auth-box { background: #111; border: 1px solid #222; padding: 30px; border-radius: 8px; width: 300px; display: flex; flex-direction: column; gap: 15px; }
        .auth-box h2 { margin: 0 0 10px 0; text-align: center; }
        .auth-box input { background: #222; border: 1px solid #444; color: white; padding: 10px; border-radius: 4px; outline: none; }
        .auth-box button { background: #0088cc; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .admin-item { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 8px 12px; border-radius: 4px; margin-top: 5px; }
        .admin-del-btn { background: #cc3333; border: none; color: white; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>
    <div id="auth-screen">
        <div class="auth-box">
            <h2 id="auth-title">Create Account</h2>
            <input type="text" id="auth-user" placeholder="Username">
            <input type="password" id="auth-pass" placeholder="Password">
            <button id="auth-btn" onclick="zalogujUzytkownika()">Submit</button>
        </div>
    </div>

    <div id="main-menu">
        <div id="sidebar">
            <button class="sidebar-btn active" onclick="switchTab('worlds-tab', this)">Worlds</button>
            <button class="sidebar-btn" onclick="switchTab('settings-tab', this)">Settings</button>
        </div>
        <div id="content-area">
            <div id="worlds-tab" class="tab-content active">
                <h1 style="margin-top: 0;">Server Worlds</h1>
                <button class="btn-create" onclick="createNewWorld()">Create New World</button>
                <div id="worlds-list"></div>
            </div>
            <div id="settings-tab" class="tab-content">
                <h1 style="margin-top: 0;">Settings</h1>
                <div class="setting-row"><span>Show FPS</span><input type="checkbox" id="set-fps" checked onchange="saveSettings()"></div>
                <div class="setting-row"><span>Show TPS</span><input type="checkbox" id="set-tps" checked onchange="saveSettings()"></div>
                <div class="setting-row"><span>Show Ping</span><input type="checkbox" id="set-ping" checked onchange="saveSettings()"></div>
                <div class="setting-row"><span>Show CPS</span><input type="checkbox" id="set-cps" checked onchange="saveSettings()"></div>
                <div class="setting-row"><span>Change Password</span><input type="password" id="set-pass" placeholder="New Password" onchange="saveSettings()"></div>
                
                <div id="owner-settings-wrapper" style="display: none; margin-top: 30px; border-top: 2px solid #222; padding-top: 20px;">
                    <h2 style="color: red; margin-top: 0;">Owner Settings (Admin Control)</h2>
                    <div style="background: #111; padding: 20px; border-radius: 6px; border: 1px solid #222; max-width: 400px;">
                        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                            <input type="text" id="admin-input" placeholder="Admin Name" style="background:#222; border:1px solid #444; color:white; padding:8px; border-radius:4px; flex-grow:1; outline:none;">
                            <button onclick="addAdminUser()" style="background:#2e8b57; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">Add</button>
                        </div>
                        <div id="admin-list-box"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="ui-panel">
        <div id="player-rank"></div>
        <div id="world-info"></div>
    </div>
    <div id="metrics-panel"></div>
    <div id="chat-container"><div id="chat-log"></div><input type="text" id="chat-input" placeholder="Press Enter to type..."></div>
    <div id="crosshair"></div>
    <div id="hud-panel">Holding: None</div>
    <button id="back-to-menu" onclick="exitWorld()">Disconnect</button>
    <script>
        // Te funkcje i zmienne są w 100% tradycyjne, HTML widzi je natychmiast!
        let currentPlayer = "Guest";
        let serverAdmins = ["alex", "notch"];
        let currentWorldIndex = 0;

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            const targetTab = document.getElementById(tabId);
            if (targetTab) targetTab.classList.add('active');
            if (btn) btn.classList.add('active');
        }

        function sprawdzCiasteczkaKonta() {
            const storedUser = localStorage.getItem('matcrafter_user');
            const storedPass = localStorage.getItem('matcrafter_pass');
            if (!storedUser || !storedPass) {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('auth-title').textContent = "Create Account";
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('auth-title').textContent = "Retype Password to Join";
                document.getElementById('auth-user').value = storedUser;
                document.getElementById('auth-user').disabled = true;
            }
        }

        function zalogujUzytkownika() {
            const userField = document.getElementById('auth-user').value.trim();
            const passField = document.getElementById('auth-pass').value.trim();
            if (!userField || !passField) return alert("Fill in fields!");
            const storedUser = localStorage.getItem('matcrafter_user');
            const storedPass = localStorage.getItem('matcrafter_pass');
            if (!storedUser) {
                localStorage.setItem('matcrafter_user', userField);
                localStorage.setItem('matcrafter_pass', passField);
                currentPlayer = userField;
            } else {
                if (passField !== storedPass) return alert("Wrong Password!");
                currentPlayer = storedUser;
            }
            document.getElementById('auth-screen').style.display = 'none';
            if (window.loadDashboardProfileSetup) { window.loadDashboardProfileSetup(); }
        }

        function saveSettings() {
            const newPass = document.getElementById('set-pass').value.trim();
            if(newPass) localStorage.setItem('matcrafter_pass', newPass);
            if(window.updateHUDDisplay) window.updateHUDDisplay();
        }

        function createNewWorld() {
            const name = prompt("Enter new world name:");
            if (!name) return;
            const generatedBlocksArray = [];
            for (let x = 0; x < 10; x++) {
                for (let z = 0; z < 10; z++) {
                    generatedBlocksArray.push({ x: x, y: 0, z: z, block: "Dirt", nbt: {} });
                }
            }
            window.worldsData.push({
                worldname: name, blocks: generatedBlocksArray, owner: currentPlayer,
                players: [{ name: currentPlayer, pos: { x: 5, y: 8, z: 14 }, dir: { x: 0, y: 0, z: -1 }, inventory: [{ slot: 0, item: "TNT", selected: true }, { slot: 1, item: "Dirt", selected: false }, { slot: 2, item: "Air", selected: false }, { slot: 3, item: "Air", selected: false }, { slot: 4, item: "Air", selected: false }, { slot: 5, item: "Air", selected: false }, { slot: 6, item: "Air", selected: false }, { slot: 7, item: "Air", selected: false }, { slot: 8, item: "Air", selected: false }] }],
                ranks: [{ name: "matwindow", displayrank: "👑Owner👑", rank: "owner", rankcolor: "red", extra: { bold: true, italic: false, underline: false } }]
            });
            if(window.updateWorldsUI) window.updateWorldsUI();
        }

        function addAdminUser() {
            const input = document.getElementById('admin-input');
            const val = input.value.trim().toLowerCase();
            if(val && !serverAdmins.includes(val)) { serverAdmins.push(val); input.value = ''; if(window.renderAdminListBox) window.renderAdminListBox(); }
        }

        function deleteAdminUser(index) { serverAdmins.splice(index, 1); if(window.renderAdminListBox) window.renderAdminListBox(); }

        window.addEventListener('DOMContentLoaded', sprawdzCiasteczkaKonta);
    </script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cloudflare.com",
                "three/addons/": "https://jsdelivr.net"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        window.worldsData = [
            {
                worldname: "hello!",
                blocks: [
                    { x: 0, y: 0, z: 0, block: "Dirt", nbt: {} },
                    { x: 1, y: 0, z: 0, block: "Dirt", nbt: {} },
                    { x: 0, y: 1, z: 0, block: "TNT", nbt: {} }
                ],
                owner: "matwindow",
                players: [],
                ranks: [{ name: "matwindow", displayrank: "👑Owner👑", rank: "owner", rankcolor: "red", extra: { bold: true, italic: false, underline: false } }]
            }
        ];

        const BLOCK_TYPES = { TNT: new THREE.MeshLambertMaterial({ color: 0xcc3333 }), Dirt: new THREE.MeshLambertMaterial({ color: 0x866043 }), Air: null, Default: new THREE.MeshLambertMaterial({ color: 0x777777 }) };
        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
        window.renderedMeshes = [];
        window.raycaster = new THREE.Raycaster();
        window.mouseVector = new THREE.Vector2();
        window.fpsCounter = 0; window.lastFpsTime = 0; window.currentFpsDisplayValue = 0;
        window.cpsCounter = 0; window.lastCpsResetTime = 0;
        window.isEngineInitialized = false;
        window.loadDashboardProfileSetup = function() {
            if(currentPlayer === "matwindow") { document.getElementById('owner-settings-wrapper').style.display = 'block'; }
            document.getElementById('set-pass').value = localStorage.getItem('matcrafter_pass') || '';
            document.title = "Matcrafter";
            window.updateWorldsUI(); window.renderAdminListBox();
        };

        window.renderAdminListBox = function() {
            const box = document.getElementById('admin-list-box');
            if (!box) return;
            box.innerHTML = '';
            serverAdmins.forEach((admin, index) => {
                const row = document.createElement('div'); row.className = 'admin-item';
                row.innerHTML = '<span>' + admin + '</span><button class="admin-del-btn" onclick="deleteAdminUser(' + index + ')">Delete</button>';
                box.appendChild(row);
            });
        };

        window.updateWorldsUI = function() {
            const list = document.getElementById('worlds-list');
            if (!list) return;
            list.innerHTML = '';
            window.worldsData.forEach((w, index) => {
                const card = document.createElement('div'); card.className = 'world-card';
                const infoDiv = document.createElement('div'); infoDiv.className = 'world-info';
                const title = document.createElement('h3'); title.textContent = w.worldname;
                const desc = document.createElement('p'); desc.textContent = 'Owner: ' + w.owner + ' | Players Online: ' + w.players.length + ' | Blocks: ' + w.blocks.length;
                infoDiv.appendChild(title); infoDiv.appendChild(desc);
                const btnDiv = document.createElement('div');
                const playBtn = document.createElement('button'); playBtn.className = 'btn-play'; playBtn.textContent = 'Connect';
                playBtn.onclick = () => loadWorld(index);
                btnDiv.appendChild(playBtn);
                if (w.owner === currentPlayer) {
                    const delBtn = document.createElement('button'); delBtn.className = 'btn-delete'; delBtn.textContent = 'Delete';
                    delBtn.onclick = () => deleteWorld(index);
                    btnDiv.appendChild(delBtn);
                }
                card.appendChild(infoDiv); card.appendChild(btnDiv); list.appendChild(card);
            });
        };

        window.deleteWorld = function(index) {
            if (confirm("Are you sure you want to delete this world?")) { window.worldsData.splice(index, 1); window.updateWorldsUI(); }
        };

        window.loadWorld = function(index) {
            currentWorldIndex = index;
            const activeWorld = window.worldsData[index];
            document.title = "MatC-" + activeWorld.worldname;
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('ui-panel').style.display = 'block';
            document.getElementById('chat-container').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('hud-panel').style.display = 'block';
            document.getElementById('metrics-panel').style.display = 'block';
            document.getElementById('back-to-menu').style.display = 'block';
            const canvasElement = document.querySelector('canvas');
            if (canvasElement) canvasElement.style.display = 'block';
            if (!window.isEngineInitialized) { window.initEngine(); }
            if (!activeWorld.players.some(p => p.name === currentPlayer)) {
                activeWorld.players.push({ name: currentPlayer, pos: { x: 5, y: 8, z: 14 }, dir: { x: 0, y: 0, z: -1 }, inventory: [{ slot: 0, item: "TNT", selected: true }, { slot: 1, item: "Dirt", selected: false }, { slot: 2, item: "Air", selected: false }, { slot: 3, item: "Air", selected: false }, { slot: 4, item: "Air", selected: false }, { slot: 5, item: "Air", selected: false }, { slot: 6, item: "Air", selected: false }, { slot: 7, item: "Air", selected: false }, { slot: 8, item: "Air", selected: false }] });
            }
            window.sceneCamera.position.set(5, 8, 14); window.sceneControls.target.set(4.5, 0, 4.5);
            window.renderWorldBlocks(); window.updateHUDDisplay();
            const log = document.getElementById('chat-log');
            log.innerHTML = '<div><span style="color: #aaa;">* Connected to server: ' + activeWorld.worldname + '</span></div>';
        };

        window.exitWorld = function() {
            document.title = "Matcrafter";
            document.getElementById('main-menu').style.display = 'flex';
            document.getElementById('ui-panel').style.display = 'none';
            document.getElementById('chat-container').style.display = 'none';
            document.getElementById('crosshair').style.display = 'none';
            document.getElementById('hud-panel').style.display = 'none';
            document.getElementById('metrics-panel').style.display = 'none';
            document.getElementById('back-to-menu').style.display = 'none';
            document.querySelector('canvas').style.display = 'none';
            window.updateWorldsUI();
        };

        window.updateHUDDisplay = function() {
            const activeWorld = window.worldsData[currentWorldIndex];
            if (!activeWorld) return;
            const profile = activeWorld.players.find(p => p.name === currentPlayer);
            if (profile) {
                const activeSlot = profile.inventory.find(i => i.selected === true);
                const hud = document.getElementById('hud-panel');
                if (activeSlot) hud.innerHTML = 'Slot ' + (activeSlot.slot + 1) + ': <span class="active-slot-glow">' + activeSlot.item + '</span>';
            }
        };
        window.renderWorldBlocks = function() {
            window.renderedMeshes.forEach(mesh => window.sceneInstance.remove(mesh));
            window.renderedMeshes = [];
            const activeWorld = window.worldsData[currentWorldIndex];
            if (!activeWorld) return;
            document.getElementById('world-info').textContent = 'Active World: ' + activeWorld.worldname + ' (Owner: ' + activeWorld.owner + ')';
            const rankElement = document.getElementById('player-rank');
            const playerRankInfo = activeWorld.ranks ? activeWorld.ranks.find(r => r.name === currentPlayer) : null;
            if (playerRankInfo) {
                rankElement.textContent = 'Player: ' + playerRankInfo.name + ' [' + playerRankInfo.displayrank + ']';
                rankElement.style.color = playerRankInfo.rankcolor; rankElement.style.fontWeight = playerRankInfo.extra.bold ? 'bold' : 'normal';
            } else {
                rankElement.textContent = 'Player: ' + currentPlayer + ' [Member]';
                rankElement.style.color = '#ffffff'; rankElement.style.fontWeight = 'normal';
            }
            activeWorld.blocks.forEach(b => {
                const material = BLOCK_TYPES[b.block] || BLOCK_TYPES.Default;
                if (material) {
                    const mesh = new THREE.Mesh(blockGeometry, material);
                    mesh.position.set(b.x, b.y, b.z); mesh.userData = { blockData: b };
                    window.sceneInstance.add(mesh); window.renderedMeshes.push(mesh);
                }
            });
        };

        window.initEngine = function() {
            window.sceneInstance = new THREE.Scene(); window.sceneInstance.background = new THREE.Color(0x87CEEB);
            window.sceneCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            window.sceneRenderer = new THREE.WebGLRenderer({ antialias: true }); window.sceneRenderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(window.sceneRenderer.domElement);
            window.sceneControls = new OrbitControls(window.sceneCamera, window.sceneRenderer.domElement);
            window.sceneControls.enableDamping = true; window.sceneControls.dampingFactor = 0.05;
            const sunLight = new THREE.DirectionalLight(0xffffff, 1.2); sunLight.position.set(10, 20, 15); window.sceneInstance.add(sunLight);
            const ambientLight = new THREE.AmbientLight(0x666666); window.sceneInstance.add(ambientLight);
            window.isEngineInitialized = true;

            window.addEventListener('keydown', (e) => {
                if (document.querySelector('canvas').style.display !== 'block') return;
                if (document.activeElement === document.getElementById('chat-input')) return;
                if (e.key >= '1' && e.key <= '9') {
                    const targetedSlotIndex = parseInt(e.key) - 1;
                    const activeWorld = window.worldsData[currentWorldIndex];
                    if (!activeWorld) return;
                    const profile = activeWorld.players.find(p => p.name === currentPlayer);
                    if (profile) { profile.inventory.forEach(slot => slot.selected = false); profile.inventory[targetedSlotIndex].selected = true; window.updateHUDDisplay(); }
                }
            });

            window.addEventListener('pointerdown', (e) => {
                if (document.querySelector('canvas').style.display !== 'block') return;
                if (document.activeElement === document.getElementById('chat-input')) return;
                window.cpsCounter++;
                window.mouseVector.x = 0; window.mouseVector.y = 0;
                window.raycaster.setFromCamera(window.mouseVector, window.sceneCamera);
                const intersects = window.raycaster.intersectObjects(window.renderedMeshes);
                if (intersects.length > 0) {
                    const targetMesh = intersects.object; const blockData = targetMesh.userData.blockData;
                    const activeWorld = window.worldsData[currentWorldIndex];
                    const myPlayerProfile = activeWorld.players.find(p => p.name === currentPlayer);
                    if (e.button === 0) {
                        const bIndex = activeWorld.blocks.findIndex(b => b === blockData);
                        if (bIndex > -1) { activeWorld.blocks.splice(bIndex, 1); window.renderWorldBlocks(); }
                    } else if (e.button === 2) {
                        if (myPlayerProfile) {
                            const selectedSlotData = myPlayerProfile.inventory.find(i => i.selected === true);
                            if (selectedSlotData && selectedSlotData.item !== "Air") {
                                const normal = intersects.face.normal;
                                const newX = blockData.x + normal.x; const newY = blockData.y + normal.y; const newZ = blockData.z + normal.z;
                                activeWorld.blocks.push({ x: newX, y: newY, z: newZ, block: selectedSlotData.item, nbt: {} });
                                window.renderWorldBlocks();
                            }
                        }
                    }
                }
            });

            window.addEventListener('contextmenu', (e) => { if (document.querySelector('canvas').style.display === 'block') e.preventDefault(); });

            window.addEventListener('keydown', (e) => {
                if (document.getElementById('chat-container').style.display !== 'block') return;
                const input = document.getElementById('chat-input');
                if (e.key === 'Enter') {
                    if (document.activeElement === input) {
                        const val = input.value.trim();
                        if (val) {
                            const activeWorld = window.worldsData[currentWorldIndex];
                            const playerRankInfo = activeWorld.ranks ? activeWorld.ranks.find(r => r.name === currentPlayer) : null;
                            const msgLine = document.createElement('div'); const prefixSpan = document.createElement('span');
                            if (playerRankInfo) { prefixSpan.style.color = playerRankInfo.rankcolor; prefixSpan.style.fontWeight = 'bold'; prefixSpan.textContent = '[' + playerRankInfo.displayrank + '] ' + currentPlayer + ': '; }
                            else { prefixSpan.textContent = currentPlayer + ': '; }
                            const textSpan = document.createElement('span'); textSpan.textContent = val; msgLine.appendChild(prefixSpan); msgLine.appendChild(textSpan);
                            const log = document.getElementById('chat-log'); log.appendChild(msgLine); log.scrollTop = log.scrollHeight; input.value = '';
                        }
                        input.blur();
                    } else { input.focus(); }
                }
            });

            const animate = () => {
                requestAnimationFrame(animate);
                if (document.querySelector('canvas').style.display === 'block') {
                    window.fpsCounter++; const time = performance.now();
                    if (time >= window.lastFpsTime + 1000) { window.currentFpsDisplayValue = Math.round((window.fpsCounter * 1000) / (time - window.lastFpsTime)); window.fpsCounter = 0; window.lastFpsTime = time; }
                    if (time >= window.lastCpsResetTime + 1000) { window.currentCpsDisplayValue = window.cpsCounter; window.cpsCounter = 0; window.lastCpsResetTime = time; }
                    let metricsHTML = '';
                    if(document.getElementById('set-fps').checked) metricsHTML += 'FPS: ' + window.currentFpsDisplayValue + '<br>';
                    if(document.getElementById('set-tps').checked) metricsHTML += 'TPS: 20.0<br>';
                    if(document.getElementById('set-ping').checked) metricsHTML += 'Ping: ' + Math.floor(window.mouseVector.x * 5 + 14) + 'ms<br>';
                    if(document.getElementById('set-cps').checked) metricsHTML += 'CPS: ' + (window.currentCpsDisplayValue || 0);
                    document.getElementById('metrics-panel').innerHTML = metricsHTML;
                    window.sceneControls.update(); window.sceneRenderer.render(window.sceneInstance, window.sceneCamera);
                }
            };
            animate();
        };

        if (currentPlayer !== "Guest") { window.loadDashboardProfileSetup(); }
        window.addEventListener('resize', () => { if (window.isEngineInitialized) { window.sceneCamera.aspect = window.innerWidth / window.innerHeight; window.sceneCamera.updateProjectionMatrix(); window.sceneRenderer.setSize(window.innerWidth, window.innerHeight); } });
    </script>
</body>
</html>
